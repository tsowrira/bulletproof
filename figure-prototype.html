<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#060611;display:flex;gap:26px;padding:26px;font:600 11px Inter,system-ui,sans-serif;color:#7c8598}
.cell{text-align:center}
svg{width:150px;height:300px;display:block}
.small svg{width:88px;height:176px}
.fill{fill:#232a3a}
.m{fill:#2b3246;stroke:#3d4661;stroke-width:.5;transition:fill .25s,filter .25s}
.m.p{fill:#5dff9f;filter:drop-shadow(0 0 4px #5dff9f90)}
.m.s{fill:#1fe0ff80}
.lbl{margin-top:8px;letter-spacing:.1em;text-transform:uppercase}
</style></head><body>
<div class="cell"><svg id="f" viewBox="0 0 100 200"></svg><div class="lbl">front</div></div>
<div class="cell"><svg id="b" viewBox="0 0 100 200"></svg><div class="lbl">back</div></div>
<div class="cell"><svg id="f2" viewBox="0 0 100 200"></svg><div class="lbl">dips lit</div></div>
<div class="cell"><svg id="b2" viewBox="0 0 100 200"></svg><div class="lbl">pull lit</div></div>
<div class="cell small"><svg id="s1" viewBox="0 0 100 200"></svg><div class="lbl">card size</div></div>
<div class="cell small"><svg id="s2" viewBox="0 0 100 200"></svg><div class="lbl">card size</div></div>
<script>
// body built from soft anatomical blocks; every block is separately lightable
const BODY = {
 front:[

  ['pec-r','M63,42 q8,3 10,12 q-8,6 -21,4 q-2,-9 0,-16z'],
  ['bi-l','M21,52 q-4,10 -2.5,21 q5,2 8,-2 q-2,-12 -1,-20z'],
  ['bi-r','M79,52 q4,10 2.5,21 q-5,2 -8,-2 q2,-12 1,-20z'],
  ['fore-l','M18,76 q-4,12 -1,24 q5,1 8,-3 q-3,-11 -2,-21z'],
  ['fore-r','M82,76 q4,12 1,24 q-5,1 -8,-3 q3,-11 2,-21z'],
  ['abs','M41,60 q9,-2 18,0 q2,16 0,32 q-9,3 -18,0 q-2,-16 0,-32z'],

 back:[

 ]
};
function draw(el, view, prim=[], sec=[]){
 el.innerHTML = BODY[view].map(([n,d,filler])=>{
  const base = filler ? 'fill' : 'm';
  const cls = prim.includes(n.replace(/-[lr]$/,'')) ? ' p' : sec.includes(n.replace(/-[lr]$/,'')) ? ' s' : '';
  return `<path class="${base}${cls}" d="${d}"></path>`;
 }).join('');
}
draw(document.getElementById('f'),'front');
draw(document.getElementById('b'),'back');
draw(document.getElementById('f2'),'front',['pec','tri','delt'],['abs']);
draw(document.getElementById('b2'),'back',['lat'],['bi','tri']);
draw(document.getElementById('s1'),'front',['pec','delt'],['tri']);
draw(document.getElementById('s2'),'back',['lat'],['bi']);
</script></body></html>
